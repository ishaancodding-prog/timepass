<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Out With Me?</title>
    <!-- Google Fonts for styling -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #3d1a33 0%, #1a0c17 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Main Container Card */
        .card {
            background: rgba(30, 15, 27, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 400px;
            height: 680px;
            border-radius: 30px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Top Progress Bars */
        .progress-bars {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-bottom: 15px;
        }

        .bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .bar.active::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: #ff4d79;
            animation: fillBar 3s linear forwards;
        }

        @keyframes fillBar {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* Illustration / Animation Area */
        .illustration-container {
            position: relative;
            margin-top: 5px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bears-img {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: floatBears 3s ease-in-out infinite;
        }

        @keyframes floatBears {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Typography */
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.6rem;
            font-weight: 600;
            color: #fce4ec;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(255, 77, 121, 0.3);
        }

        .subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            text-align: center;
        }

        /* Date Picker Input Group */
        .date-picker-group {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        .date-picker-group label {
            font-size: 0.75rem;
            color: #ff4d79;
            font-weight: 600;
        }

        .date-picker-group input {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            outline: none;
            color-scheme: dark;
        }

        /* Action Buttons */
        .btn-group {
            position: absolute;
            bottom: 30px;
            width: calc(100% - 40px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4d79 0%, #ff1a53 100%);
            color: white;
            flex: 1;
            box-shadow: 0 8px 25px rgba(255, 77, 121, 0.4);
            text-align: center;
        }

        .btn-yes:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 77, 121, 0.6);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            position: relative;
            white-space: nowrap;
        }

        .btn-no:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Success Screen Styling */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .success-screen h2 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            color: #ff4d79;
            margin-bottom: 10px;
        }

        .success-screen p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .btn-calendar {
            background: #4285F4;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
            transition: transform 0.2s;
        }

        .btn-calendar:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Main Interactive Screen -->
        <div id="main-screen" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="progress-bars">
                <div class="bar active"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <div class="illustration-container">
                <img src="https://media1.giphy.com/media/20k1un6aBQKLivWDIC/giphy.gif" alt="Cute hugging bears" class="bears-img">
            </div>

            <h1>Will you go out with me?</h1>
            <p class="subtitle">There is only one right answer...</p>

            <!-- Date & Time Selector -->
            <div class="date-picker-group">
                <label for="datePicker">When are you free?</label>
                <input type="datetime-local" id="datePicker">
            </div>

            <div class="btn-group">
                <button class="btn btn-no" id="noBtn">Think again...</button>
                <button class="btn btn-yes" id="yesBtn">Yes!</button>
            </div>
        </div>

        <!-- Success Screen (Hidden by default) -->
        <div class="success-screen" id="successScreen">
            <h2>Yay! 🎉</h2>
            <img src="https://media4.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Happy dancing bears" style="width: 160px; border-radius: 15px; margin-bottom: 15px;">
            <p>Looking forward to our date! ❤️</p>
            <a href="#" id="calendarLink" class="btn-calendar" target="_blank">📅 Add to Google Calendar</a>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainScreen = document.getElementById('main-screen');
        const successScreen = document.getElementById('successScreen');
        const datePicker = document.getElementById('datePicker');
        const calendarLink = document.getElementById('calendarLink');

        // Set default date picker value to tomorrow at 6:00 PM
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(18, 0, 0, 0);
        datePicker.value = tomorrow.toISOString().slice(0, 16);

        const noMessages = [
            "Think again...",
            "Are you sure?",
            "What about a coffee?",
            "Don't break my heart 🥺",
            "Wrong button!",
            "Try the pink one 👉",
            "Pretty please?"
        ];

        let clickCount = 0;

        noBtn.addEventListener('click', () => {
            clickCount++;
            const messageIndex = clickCount % noMessages.length;
            noBtn.textContent = noMessages[messageIndex];

            let currentScale = 1 + (clickCount * 0.08);
            yesBtn.style.transform = `scale(${currentScale})`;
        });

        yesBtn.addEventListener('click', () => {
            // Get selected date value
            const selectedDate = new Date(datePicker.value);
            
            if (!isNaN(selectedDate.getTime())) {
                // Format for Google Calendar URL (YYYYMMDDTHHmmssZ)
                const startIso = selectedDate.toISOString().replace(/-|:|\.\d+/g, '');
                // Assume a 2-hour duration for the date
                const endDate = new Date(selectedDate.getTime() + 2 * 60 * 60 * 1000);
                const endIso = endDate.toISOString().replace(/-|:|\.\d+/g, '');

                const text = encodeURIComponent("Our Date ❤️");
                const details = encodeURIComponent("It's a date! Looking forward to spending time together.");
                
                // Build Google Calendar Link
                const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${startIso}/${endIso}&details=${details}`;
                calendarLink.href = gCalUrl;
            }

            mainScreen.style.display = 'none';
            successScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
