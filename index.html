<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABTalks — 60-Day Coding Challenge Hub (Agentic AI Dialog Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        /* Agentic AI / Physical Device Standalone UI/UX Dialog Bar Theme */
        :root {
            --bg-base: #060811;
            --panel-glass: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(56, 189, 248, 0.25);
            --dialog-bar: rgba(10, 15, 30, 0.92);
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.15), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.1), transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }

        .agentic-panel {
            background: var(--panel-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Standalone Physical Device Dialog Bar */
        .agentic-dialog-bar {
            background: var(--dialog-bar);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(56, 189, 248, 0.2);
        }

        .agentic-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.35);
            transition: all 0.3s ease;
        }

        .agentic-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.55);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
            50% { opacity: 1; box-shadow: 0 0 30px rgba(56, 189, 248, 0.6); }
        }
        .animate-ai-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes waveAnim {
            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }
        .wave-bar-1 { animation: waveAnim 1.2s ease-in-out infinite; }
        .wave-bar-2 { animation: waveAnim 0.9s ease-in-out infinite 0.2s; }
        .wave-bar-3 { animation: waveAnim 1.4s ease-in-out infinite 0.4s; }
        .wave-bar-4 { animation: waveAnim 1s ease-in-out infinite 0.1s; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 lg:p-10 selection:bg-cyan-500 selection:text-slate-950">

    <!-- Ambient Floating Aura -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[400px] bg-sky-500/10 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- HEADER / NAVIGATION (Responsive for Laptop and Phone) -->
    <header class="max-w-4xl mx-auto w-full agentic-panel px-5 py-3.5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3 z-20">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('/')">
            <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center font-bold text-cyan-300 text-sm animate-ai-glow">
                🔮
            </div>
            <div>
                <span class="font-extrabold text-xs tracking-wider text-white uppercase block">ABTALKS</span>
                <span class="text-[9px] text-cyan-400 font-mono">Agentic AI Coding Hub</span>
            </div>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-white/10 text-xs font-semibold">
            <button onclick="router.navigate('/')" id="r-home" class="px-3 py-1.5 rounded-lg transition text-slate-400">Home (/)</button>
            <button onclick="router.navigate('/dashboard')" id="r-dash" class="px-3 py-1.5 rounded-lg transition text-slate-400">Dashboard (/dashboard)</button>
            <button onclick="router.navigate('/day/1')" id="r-day" class="px-3 py-1.5 rounded-lg transition text-slate-400">Day 1 (/day/1)</button>
        </div>
    </header>

    <!-- DYNAMIC ROUTER VIEW CONTAINER -->
    <main id="appContainer" class="flex-grow max-w-4xl mx-auto w-full my-6 z-10 flex flex-col justify-center"></main>

    <!-- STANDALONE AI AGENTIC DIALOG BAR (Inspired by Dribbble Agentic AI Device UI) -->
    <div class="max-w-xl mx-auto w-full z-30 mb-4 px-2">
        <div class="agentic-dialog-bar px-4 py-3 rounded-2xl flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="flex items-end gap-1 px-1 h-6">
                    <div class="w-1 bg-cyan-400 rounded-full wave-bar-1"></div>
                    <div class="w-1 bg-indigo-400 rounded-full wave-bar-2"></div>
                    <div class="w-1 bg-cyan-300 rounded-full wave-bar-3"></div>
                    <div class="w-1 bg-sky-400 rounded-full wave-bar-4"></div>
                </div>
                <div class="text-xs">
                    <span class="text-slate-400 font-mono block text-[10px]">AI Agentic Assistant</span>
                    <span id="aiStatusText" class="text-white font-medium">Ready to review your GitHub commits & streaks.</span>
                </div>
            </div>
            <button onclick="app.triggerAiAssistant()" class="bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-cyan-500/30 transition">
                Ask AI ✦
            </button>
        </div>
    </div>

    <!-- ROUTE MAP FOOTER (Strictly Required Format) -->
    <footer class="max-w-4xl mx-auto w-full agentic-panel p-4 rounded-2xl text-xs font-mono text-slate-400 text-center z-20 space-y-1">
        <div class="font-bold text-cyan-400">Route Map Specification:</div>
        <div class="text-slate-300">/</div>
        <div class="text-slate-300">/dashboard</div>
        <div class="text-slate-300">/day/1</div>
    </footer>

    <!-- CORE APP ENGINE SCRIPT -->
    <script>
        const store = {
            currentUser: JSON.parse(localStorage.getItem('agentic_user')) || null,
            streak: parseInt(localStorage.getItem('agentic_streak')) || 0,
            completedDays: JSON.parse(localStorage.getItem('agentic_completed')) || [],
            githubUrl: localStorage.getItem('agentic_gh_1') || '',
            linkedinUrl: localStorage.getItem('agentic_li_1') || '',
            authMode: 'login', // 'login' or 'signup'
            aiMessages: [
                "Analyzing late-night commit frequency...",
                "Streak verification active: Ready for Day 1 challenge submission.",
                "Recruiter visibility algorithm is synchronized with your LinkedIn feed."
            ]
        };

        const router = {
            navigate(path) {
                window.location.hash = path;
                this.render(path);
            },
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.render(path);
            },
            render(path) {
                const container = document.getElementById('appContainer');
                let html = '';

                // Highlight active nav tab
                ['home', 'dash', 'day'].forEach(id => {
                    const el = document.getElementById(`r-${id}`);
                    if (el) el.className = "px-3 py-1.5 rounded-lg transition text-slate-400";
                });
                if (path === '/') document.getElementById('r-home').className = "px-3 py-1.5 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold shadow-sm";
                if (path === '/dashboard') document.getElementById('r-dash').className = "px-3 py-1.5 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold shadow-sm";
                if (path === '/day/1') document.getElementById('r-day').className = "px-3 py-1.5 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold shadow-sm";

                if (path === '/') html = this.views.home();
                else if (path === '/dashboard') html = this.views.dashboard();
                else if (path === '/day/1') html = this.views.day1();
                else html = this.views.home();

                container.innerHTML = html;
            },

            views: {
                home() {
                    const isAuth = store.currentUser !== null;
                    return `
                        <div class="agentic-panel p-8 sm:p-12 rounded-[2.5rem] space-y-6 text-center animate-fadeIn relative overflow-hidden">
                            <div class="absolute -top-24 -right-24 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

                            <div class="inline-flex items-center gap-2 bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest backdrop-blur-md">
                                ⚡ Agentic AI Coding Companion • 60-Day Challenge
                            </div>
                            
                            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight max-w-2xl mx-auto">
                                Build Every Night. <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-sky-200">Command Recruiter Attention.</span>
                            </h1>
                            
                            <p class="text-sm sm:text-base text-slate-300 leading-relaxed max-w-xl mx-auto">
                                Designed for Indian college students coding late at night. Turn post-college hours into verified GitHub commits and viral LinkedIn learning streaks.
                            </p>

                            <div class="pt-2 max-w-sm mx-auto space-y-3">
                                ${!isAuth ? `
                                    <button onclick="router.navigate('/dashboard')" class="agentic-btn w-full py-4 rounded-2xl text-sm">
                                        Get Started / Sign In 🚀
                                    </button>
                                ` : `
                                    <button onclick="router.navigate('/dashboard')" class="agentic-btn w-full py-4 rounded-2xl text-sm">
                                        Open Dashboard ⚡
                                    </button>
                                `}
                                <button onclick="router.navigate('/day/1')" class="w-full bg-white/5 border border-white/10 py-3.5 rounded-2xl text-xs font-bold text-slate-300 hover:bg-white/10 transition">
                                    Preview Day 1 Challenge
                                </button>
                            </div>

                            <div class="grid grid-cols-3 gap-3 pt-6 text-left max-w-md mx-auto">
                                <div class="agentic-panel p-4 rounded-2xl">
                                    <div class="text-base sm:text-lg font-extrabold text-white">60 Days</div>
                                    <div class="text-[10px] text-slate-400">Consistency Arc</div>
                                </div>
                                <div class="agentic-panel p-4 rounded-2xl">
                                    <div class="text-base sm:text-lg font-extrabold text-cyan-400">GitHub</div>
                                    <div class="text-[10px] text-slate-400">Automatic Sync</div>
                                </div>
                                <div class="agentic-panel p-4 rounded-2xl">
                                    <div class="text-base sm:text-lg font-extrabold text-sky-300">LinkedIn</div>
                                    <div class="text-[10px] text-slate-400">Public Proof</div>
                                </div>
                            </div>
                        </div>
                    `;
                },

                dashboard() {
                    const isZeroStreak = store.streak === 0;
                    const completionRate = Math.round((store.completedDays.length / 60) * 100);
                    const isAuth = store.currentUser !== null;

                    if (!isAuth) {
                        const isLogin = store.authMode === 'login';
                        return `
                            <div class="max-w-md mx-auto w-full agentic-panel p-8 sm:p-10 rounded-[2.5rem] space-y-6 animate-fadeIn">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-extrabold text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Agentic Gateway</span>
                                    <div class="flex gap-1 bg-slate-950 p-1 rounded-xl text-xs font-bold">
                                        <button onclick="store.authMode='login'; router.render('/dashboard')" class="px-3 py-1 rounded-lg transition ${isLogin ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Login</button>
                                        <button onclick="store.authMode='signup'; router.render('/dashboard')" class="px-3 py-1 rounded-lg transition ${!isLogin ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Sign Up</button>
                                    </div>
                                </div>

                                <div class="space-y-1">
                                    <h2 class="text-xl font-extrabold text-white">${isLogin ? 'Welcome Back!' : 'Create Account'}</h2>
                                    <p class="text-xs text-slate-300">${isLogin ? 'Log in to access your 60-day dashboard.' : 'Register and initialize your Day 1 challenge.'}</p>
                                </div>

                                <div class="space-y-4 pt-1">
                                    ${!isLogin ? `
                                        <div class="space-y-1">
                                            <label class="block text-xs font-bold uppercase text-slate-400">Full Name</label>
                                            <input type="text" id="dashName" placeholder="Aarav Sharma" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                        </div>
                                    ` : ''}
                                    <div class="space-y-1">
                                        <label class="block text-xs font-bold uppercase text-slate-400">College Email</label>
                                        <input type="email" id="dashEmail" placeholder="student@university.ac.in" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                    </div>
                                    <div class="space-y-1">
                                        <label class="block text-xs font-bold uppercase text-slate-400">Password</label>
                                        <input type="password" id="dashPass" placeholder="••••••••" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                    </div>
                                    <button onclick="app.handleAuth()" class="agentic-btn w-full py-3.5 rounded-xl text-sm mt-2">
                                        ${isLogin ? 'Access Dashboard ⚡' : 'Initialize Account 🚀'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="space-y-6 animate-fadeIn">
                            <!-- Edge Case Handling: First day with no streak or missed day warning -->
                            ${isZeroStreak ? `
                                <div class="bg-amber-500/15 border border-amber-500/30 p-4 rounded-2xl text-xs text-amber-200 flex flex-col sm:flex-row items-center justify-between gap-3">
                                    <span>⚠️ Edge Case Handled: No active streak yet. Complete Day 1 to ignite your profile!</span>
                                    <button onclick="router.navigate('/day/1')" class="underline font-bold bg-amber-500/20 px-3 py-1 rounded-lg">Start Day 1</button>
                                </div>
                            ` : ''}

                            <!-- User Profile & Streak Widget -->
                            <div class="agentic-panel p-6 sm:p-8 rounded-[2.5rem] flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div class="space-y-1 text-center sm:text-left">
                                    <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Authenticated Scholar: ${store.currentUser.name}</span>
                                    <div class="text-4xl font-extrabold text-white mt-1">${store.streak} <span class="text-base text-cyan-300 font-normal">Day Streak 🔥</span></div>
                                </div>
                                <div class="text-center sm:text-right">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Overall Completion</span>
                                    <div class="text-3xl font-extrabold text-emerald-400 mt-1">${completionRate}%</div>
                                </div>
                            </div>

                            <!-- Today's Task Card -->
                            <div class="agentic-panel p-6 sm:p-8 rounded-[2.5rem] space-y-4 border-cyan-500/40">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-extrabold text-cyan-300 bg-cyan-500/10 px-3.5 py-1 rounded-full border border-cyan-500/20">Today's Task • Day 1</span>
                                    <span class="text-xs text-slate-400">Pending Proof of Work</span>
                                </div>
                                <h3 class="text-base sm:text-lg font-bold text-white">Environment Setup & Hello World</h3>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">Initialize your public GitHub repository, configure your tools, and publish your initial proof of work.</p>
                                <button onclick="router.navigate('/day/1')" class="agentic-btn w-full py-3.5 rounded-xl text-xs sm:text-sm">
                                    Open Day 1 Challenge ⚡
                                </button>
                            </div>
                        </div>
                    `;
                },

                day1() {
                    const isSubmitted = store.completedDays.includes(1);

                    return `
                        <div class="max-w-2xl mx-auto w-full agentic-panel p-8 sm:p-10 rounded-[2.5rem] space-y-6 animate-fadeIn">
                            <div class="flex justify-between items-center">
                                <button onclick="router.navigate('/dashboard')" class="text-xs sm:text-sm text-slate-400 hover:text-white font-bold">← Dashboard</button>
                                <span class="text-xs font-bold text-cyan-300 bg-cyan-500/10 px-3.5 py-1 rounded-full border border-cyan-500/20">Day 1 of 60</span>
                            </div>

                            <div class="space-y-2">
                                <h1 class="text-xl sm:text-2xl font-extrabold text-white">Environment Setup & Hello World</h1>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">Set up your workspace, create your first repository, and deploy a simple landing page or script to kick off your journey.</p>
                            </div>

                            <div class="space-y-4 pt-2">
                                <div class="space-y-1">
                                    <label class="block text-xs font-bold uppercase text-slate-400">GitHub Repository / Commit URL</label>
                                    <input type="text" id="ghInput" value="${store.githubUrl}" placeholder="https://github.com/username/repo-day1" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <div class="space-y-1">
                                    <label class="block text-xs font-bold uppercase text-slate-400">LinkedIn Post URL</label>
                                    <input type="text" id="liInput" value="${store.linkedinUrl}" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <button onclick="app.submitDay1()" class="agentic-btn w-full py-3.5 rounded-xl text-xs sm:text-sm">
                                    ${isSubmitted ? 'Update Day 1 Submission ✓' : 'Submit Proof & Sync Streak ⚡'}
                                </button>
                            </div>

                            ${isSubmitted ? `
                                <div class="agentic-panel bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-2xl text-center text-xs sm:text-sm text-emerald-300 font-bold">
                                    🎉 Day 1 Verified Successfully! Your public learning streak is active.
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            }
        };

        const app = {
            handleAuth() {
                const email = document.getElementById('dashEmail').value.trim();
                const pass = document.getElementById('dashPass').value.trim();
                const nameInput = document.getElementById('dashName');
                const name = nameInput ? (nameInput.value.trim() || 'Scholar') : (email.split('@')[0] || 'Scholar');

                if (!email || !pass) {
                    alert('Please enter your email and password.');
                    return;
                }

                store.currentUser = { name, email };
                localStorage.setItem('agentic_user', JSON.stringify(store.currentUser));
                router.navigate('/dashboard');
            },

            submitDay1() {
                const gh = document.getElementById('ghInput').value.trim();
                const li = document.getElementById('liInput').value.trim();
                if (!gh || !li) {
                    alert('Please provide both GitHub and LinkedIn proof links.');
                    return;
                }
                store.githubUrl = gh;
                store.linkedinUrl = li;
                if (!store.completedDays.includes(1)) {
                    store.completedDays.push(1);
                    store.streak = 1; // Ignite streak on Day 1 completion
                }
                localStorage.setItem('agentic_gh_1', gh);
                localStorage.setItem('agentic_li_1', li);
                localStorage.setItem('agentic_completed', JSON.stringify(store.completedDays));
                localStorage.setItem('agentic_streak', store.streak);
                router.render('/day/1');
            },

            triggerAiAssistant() {
                const randomMsg = store.aiMessages[Math.floor(Math.random() * store.aiMessages.length)];
                document.getElementById('aiStatusText').innerText = randomMsg;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
