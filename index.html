<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Out With Me?</title>
  <link rel="stylesheet" href="valentine.css" />
</head>
<body>

  <!-- Card Container -->
  <main class="card">
    
    <!-- Top Progress Bar -->
    <div class="progress-bar">
      <div class="progress-segment active"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
    </div>

    <!-- Main Content Step -->
    <section class="step is-active" id="s-main">
      <div class="illustration">
        <img src="https://gifdb.com/images/high/cute-milk-and-mocha-hug-kiss-411x5j0pxmve1yq5.webp" alt="Cute Bears Hugging" />
      </div>

      <h1 class="question">Will you go out with me?</h1>
      <p class="subtext">There is only one right answer...</p>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="yes-btn" class="btn btn-yes">Yes!</button>
        <button id="no-btn" class="btn btn-no">Think again...</button>
      </div>
    </section>

    <!-- Optional Step (Revealed after clicking Yes) -->
    <section class="step" id="s-when" inert>
      <h2>When are you free?</h2>
      <div role="radiogroup" class="options">
        <button role="radio" aria-checked="false" data-iso="2026-08-07">
          <span>Fri</span>
        </button>
      </div>
    </section>

  </main>

  <script src="valentine.js"></script>
</body>
</html>
