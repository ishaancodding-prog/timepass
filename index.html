
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABTalks — 60-Day Coding Challenge Hub (Daily Calendar & Task Manager)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-base: #060811;
            --panel-glass: rgba(15, 23, 42, 0.78);
            --border-glow: rgba(56, 189, 248, 0.3);
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.15), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.1), transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }

        .sys-panel {
            background: var(--panel-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sys-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sys-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.6);
        }

        @keyframes pageSlideIn {
            0% { opacity: 0; transform: translateY(14px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-page-in { animation: pageSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 lg:p-10 selection:bg-cyan-500 selection:text-slate-950">

    <!-- Ambient Aura -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[400px] bg-sky-500/15 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- RESPONSIVE HEADER -->
    <header class="max-w-4xl mx-auto w-full sys-panel px-5 py-3.5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3 z-20">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="router.navigate('/')">
            <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center font-bold text-cyan-300 text-sm">
                📅
            </div>
            <div>
                <span class="font-extrabold text-xs tracking-wider text-white uppercase block">ABTALKS</span>
                <span class="text-[9px] text-cyan-400 font-mono">Daily Calendar & Task Hub</span>
            </div>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-white/10 text-xs font-semibold">
            <button onclick="router.navigate('/')" id="r-home" class="px-3 py-1.5 rounded-lg transition-all text-slate-400">Home (/)</button>
            <button onclick="router.navigate('/dashboard')" id="r-dash" class="px-3 py-1.5 rounded-lg transition-all text-slate-400">Dashboard (/dashboard)</button>
            <button onclick="router.navigate('/day/1')" id="r-day" class="px-3 py-1.5 rounded-lg transition-all text-slate-400">Day 1 (/day/1)</button>
            <button onclick="router.navigate('/calendar')" id="r-cal" class="px-3 py-1.5 rounded-lg transition-all text-slate-400">Calendar</button>
        </div>
    </header>

    <!-- DYNAMIC ROUTER VIEW CONTAINER -->
    <main id="appContainer" class="flex-grow max-w-4xl mx-auto w-full my-6 z-10 flex flex-col justify-center"></main>

    <!-- ROUTE MAP FOOTER -->
    <footer class="max-w-4xl mx-auto w-full sys-panel p-4 rounded-2xl text-xs font-mono text-slate-400 text-center z-20 space-y-1">
        <div class="font-bold text-cyan-400">Route Map Specification:</div>
        <div class="text-slate-300">/</div>
        <div class="text-slate-300">/dashboard</div>
        <div class="text-slate-300">/day/1</div>
    </footer>

    <!-- APP ENGINE SCRIPT -->
    <script>
        const store = {
            currentUser: JSON.parse(localStorage.getItem('cal_user')) || null,
            streak: parseInt(localStorage.getItem('cal_streak')) || 0,
            completedDays: JSON.parse(localStorage.getItem('cal_completed')) || [],
            githubUrl: localStorage.getItem('cal_gh_1') || '',
            linkedinUrl: localStorage.getItem('cal_li_1') || '',
            authMode: 'login',
            calendarData: JSON.parse(localStorage.getItem('cal_daily_data')) || {
                "Monday, August 17, 2026": {
                    work: ["Review project proposals by 2:00 PM", "Run backend debugging tests"],
                    personal: ["Morning workout session (30 mins)", "Read two chapters of book"],
                    appointments: ["Team sync-up at 10:00 AM"],
                    reminders: ["Submit weekly progress report"]
                },
                "Tuesday, August 18, 2026": {
                    work: ["Prepare slide deck for client presentation", "Clear inbox and reply to stakeholders"],
                    personal: ["Grocery shopping for meal prep", "Call family in evening"],
                    appointments: ["Dentist check-up at 3:30 PM"],
                    reminders: ["Back up local project files"]
                },
                "Wednesday, August 19, 2026": {
                    work: ["Conduct code reviews for team PRs", "Finalize sprint planning goals"],
                    personal: ["Evening jog in neighborhood", "Water indoor plants"],
                    appointments: ["1-on-1 check-in with manager at 11:00 AM"],
                    reminders: ["Pay monthly utility bills"]
                }
            }
        };

        const router = {
            navigate(path) {
                window.location.hash = path;
                this.render(path);
            },
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.render(path);
            },
            render(path) {
                const container = document.getElementById('appContainer');
                container.style.opacity = '0';
                
                setTimeout(() => {
                    let html = '';
                    ['home', 'dash', 'day', 'cal'].forEach(id => {
                        const el = document.getElementById(`r-${id}`);
                        if (el) el.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400";
                    });
                    if (path === '/') document.getElementById('r-home').className = "px-3 py-1.5 rounded-lg transition-all bg-cyan-500 text-slate-950 font-extrabold shadow-md";
                    if (path === '/dashboard') document.getElementById('r-dash').className = "px-3 py-1.5 rounded-lg transition-all bg-cyan-500 text-slate-950 font-extrabold shadow-md";
                    if (path === '/day/1') document.getElementById('r-day').className = "px-3 py-1.5 rounded-lg transition-all bg-cyan-500 text-slate-950 font-extrabold shadow-md";
                    if (path === '/calendar') document.getElementById('r-cal').className = "px-3 py-1.5 rounded-lg transition-all bg-cyan-500 text-slate-950 font-extrabold shadow-md";

                    if (path === '/') html = this.views.home();
                    else if (path === '/dashboard') html = this.views.dashboard();
                    else if (path === '/day/1') html = this.views.day1();
                    else if (path === '/calendar') html = this.views.calendar();
                    else html = this.views.home();

                    container.innerHTML = html;
                    container.className = "flex-grow max-w-4xl mx-auto w-full my-6 z-10 flex flex-col justify-center animate-page-in";
                    container.style.opacity = '1';
                }, 150);
            },

            views: {
                home() {
                    const isAuth = store.currentUser !== null;
                    return `
                        <div class="sys-panel p-8 sm:p-12 rounded-[2.5rem] space-y-6 text-center relative overflow-hidden">
                            <div class="inline-flex items-center gap-2 bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest backdrop-blur-md">
                                📅 60-Day Challenge & Daily Task Calendar
                            </div>
                            
                            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight max-w-2xl mx-auto">
                                Manage Tasks & Days with <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-sky-200">Crystal Clarity.</span>
                            </h1>
                            
                            <p class="text-sm sm:text-base text-slate-300 leading-relaxed max-w-xl mx-auto">
                                Integrated day-wise calendar schedules, work tasks, personal reminders, and clean daily management tailored for students.
                            </p>

                            <div class="pt-2 max-w-sm mx-auto space-y-3">
                                <button onclick="router.navigate('/dashboard')" class="sys-btn w-full py-4 rounded-2xl text-sm">
                                    ${isAuth ? 'Open Dashboard ⚡' : 'Get Started / Sign In 🚀'}
                                </button>
                                <button onclick="router.navigate('/calendar')" class="w-full bg-white/5 border border-white/10 py-3.5 rounded-2xl text-xs font-bold text-slate-300 hover:bg-white/10 transition">
                                    View Daily Calendar Schedule 🗓️
                                </button>
                            </div>
                        </div>
                    `;
                },

                dashboard() {
                    const isZeroStreak = store.streak === 0;
                    const completionRate = Math.round((store.completedDays.length / 60) * 100);
                    const isAuth = store.currentUser !== null;

                    if (!isAuth) {
                        const isLogin = store.authMode === 'login';
                        return `
                            <div class="max-w-md mx-auto w-full sys-panel p-8 sm:p-10 rounded-[2.5rem] space-y-6">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-extrabold text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Secure Gateway</span>
                                    <div class="flex gap-1 bg-slate-950 p-1 rounded-xl text-xs font-bold">
                                        <button onclick="store.authMode='login'; router.render('/dashboard')" class="px-3.5 py-1.5 rounded-lg ${isLogin ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Login</button>
                                        <button onclick="store.authMode='signup'; router.render('/dashboard')" class="px-3.5 py-1.5 rounded-lg ${!isLogin ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Sign Up</button>
                                    </div>
                                </div>
                                <div class="space-y-1">
                                    <h2 class="text-xl font-extrabold text-white">${isLogin ? 'Welcome Back!' : 'Create Account'}</h2>
                                    <p class="text-xs text-slate-300">Authenticate to access your calendar and task manager.</p>
                                </div>
                                <div class="space-y-4 pt-1">
                                    ${!isLogin ? `
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Full Name</label>
                                            <input type="text" id="dashName" placeholder="Aarav Sharma" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                        </div>
                                    ` : ''}
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">College Email</label>
                                        <input type="email" id="dashEmail" placeholder="student@university.ac.in" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                                        <input type="password" id="dashPass" placeholder="••••••••" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                    </div>
                                    <button onclick="app.handleAuth()" class="sys-btn w-full py-3.5 rounded-xl text-sm mt-2">
                                        ${isLogin ? 'Access Dashboard ⚡' : 'Initialize Account 🚀'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="space-y-6">
                            <!-- Stats Widget -->
                            <div class="sys-panel p-6 sm:p-8 rounded-[2.5rem] flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div class="space-y-1 text-center sm:text-left">
                                    <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Scholar: ${store.currentUser.name}</span>
                                    <div class="text-4xl font-extrabold text-white mt-1">${store.streak} <span class="text-base text-cyan-300 font-normal">Day Streak 🔥</span></div>
                                </div>
                                <div class="text-center sm:text-right flex flex-col gap-2">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Completion Rate</span>
                                    <div class="text-3xl font-extrabold text-emerald-400">${completionRate}%</div>
                                    <button onclick="router.navigate('/calendar')" class="text-xs text-cyan-300 underline font-bold">Open Daily Calendar →</button>
                                </div>
                            </div>

                            <!-- Task Management Quick Panel -->
                            <div class="sys-panel p-6 rounded-[2.5rem] space-y-4">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-sm font-bold text-white uppercase tracking-wider">Quick Task Manager</h3>
                                    <span class="text-xs text-slate-400">Manage daily items</span>
                                </div>
                                <button onclick="router.navigate('/calendar')" class="sys-btn w-full py-3 rounded-xl text-xs">
                                    View & Edit Daywise Calendar & Tasks 📅
                                </button>
                            </div>

                            <div class="text-center">
                                <button onclick="app.handleLogout()" class="text-xs text-slate-400 hover:text-red-400 transition underline">Log out ⎋</button>
                            </div>
                        </div>
                    `;
                },

                calendar() {
                    let calendarHtml = '';
                    for (const [dayName, categories] of Object.entries(store.calendarData)) {
                        calendarHtml += `
                            <div class="sys-panel p-6 rounded-[2rem] space-y-4">
                                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 class="text-sm font-bold text-cyan-300">${dayName}</h3>
                                    <button onclick="app.addNewTaskPrompt('${dayName}')" class="text-xs bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 px-3 py-1 rounded-lg hover:bg-cyan-500/30 transition">+ Add Task</button>
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                    <!-- Work Tasks -->
                                    <div class="bg-slate-950/50 p-3.5 rounded-xl border border-white/10 space-y-2">
                                        <div class="font-bold uppercase tracking-wider text-slate-400 text-[10px]">Work Tasks</div>
                                        <ul class="space-y-1 list-disc list-inside text-slate-200">
                                            ${categories.work.map((t, idx) => `
                                                <li class="flex justify-between items-center group">
                                                    <span>${t}</span>
                                                    <button onclick="app.removeTaskItem('${dayName}', 'work', ${idx})" class="text-slate-500 hover:text-red-400 text-[10px] opacity-0 group-hover:opacity-100 transition">✕</button>
                                                </li>
                                            `).join('')}
                                            ${categories.work.length === 0 ? '<li class="text-slate-600 italic">No tasks listed</li>' : ''}
                                        </ul>
                                    </div>

                                    <!-- Personal Tasks -->
                                    <div class="bg-slate-950/50 p-3.5 rounded-xl border border-white/10 space-y-2">
                                        <div class="font-bold uppercase tracking-wider text-slate-400 text-[10px]">Personal Tasks</div>
                                        <ul class="space-y-1 list-disc list-inside text-slate-200">
                                            ${categories.personal.map((t, idx) => `
                                                <li class="flex justify-between items-center group">
                                                    <span>${t}</span>
                                                    <button onclick="app.removeTaskItem('${dayName}', 'personal', ${idx})" class="text-slate-500 hover:text-red-400 text-[10px] opacity-0 group-hover:opacity-100 transition">✕</button>
                                                </li>
                                            `).join('')}
                                            ${categories.personal.length === 0 ? '<li class="text-slate-600 italic">No tasks listed</li>' : ''}
                                        </ul>
                                    </div>

                                    <!-- Appointments -->
                                    <div class="bg-slate-950/50 p-3.5 rounded-xl border border-white/10 space-y-2">
                                        <div class="font-bold uppercase tracking-wider text-slate-400 text-[10px]">Appointments</div>
                                        <ul class="space-y-1 list-disc list-inside text-slate-200">
                                            ${categories.appointments.map((t, idx) => `
                                                <li class="flex justify-between items-center group">
                                                    <span>${t}</span>
                                                    <button onclick="app.removeTaskItem('${dayName}', 'appointments', ${idx})" class="text-slate-500 hover:text-red-400 text-[10px] opacity-0 group-hover:opacity-100 transition">✕</button>
                                                </li>
                                            `).join('')}
                                            ${categories.appointments.length === 0 ? '<li class="text-slate-600 italic">No appointments listed</li>' : ''}
                                        </ul>
                                    </div>

                                    <!-- Reminders -->
                                    <div class="bg-slate-950/50 p-3.5 rounded-xl border border-white/10 space-y-2">
                                        <div class="font-bold uppercase tracking-wider text-slate-400 text-[10px]">Reminders</div>
                                        <ul class="space-y-1 list-disc list-inside text-slate-200">
                                            ${categories.reminders.map((t, idx) => `
                                                <li class="flex justify-between items-center group">
                                                    <span>${t}</span>
                                                    <button onclick="app.removeTaskItem('${dayName}', 'reminders', ${idx})" class="text-slate-500 hover:text-red-400 text-[10px] opacity-0 group-hover:opacity-100 transition">✕</button>
                                                </li>
                                            `).join('')}
                                            ${categories.reminders.length === 0 ? '<li class="text-slate-600 italic">No reminders listed</li>' : ''}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="space-y-6">
                            <div class="sys-panel p-6 rounded-[2.5rem] flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-extrabold text-white">Day-Wise Calendar & Task Hub</h2>
                                    <p class="text-xs text-slate-300">Clear, organized daily schedule divided by category.</p>
                                </div>
                                <button onclick="router.navigate('/dashboard')" class="text-xs text-cyan-300 underline font-bold">← Dashboard</button>
                            </div>

                            <div class="space-y-6">
                                ${calendarHtml}
                            </div>
                        </div>
                    `;
                },

                day1() {
                    const isSubmitted = store.completedDays.includes(1);

                    return `
                        <div class="max-w-2xl mx-auto w-full sys-panel p-8 sm:p-10 rounded-[2.5rem] space-y-6">
                            <div class="flex justify-between items-center">
                                <button onclick="router.navigate('/dashboard')" class="text-xs sm:text-sm text-slate-400 hover:text-white font-bold transition-colors">← Dashboard</button>
                                <span class="text-xs font-bold text-cyan-300 bg-cyan-500/10 px-3.5 py-1 rounded-full border border-cyan-500/20">Day 1 of 60</span>
                            </div>

                            <div class="space-y-2">
                                <h1 class="text-xl sm:text-2xl font-extrabold text-white">Environment Setup & Hello World</h1>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">Set up your workspace, create your first repository, and submit verification proof.</p>
                            </div>

                            <div class="space-y-4 pt-2">
                                <div class="space-y-1">
                                    <label class="block text-xs font-bold uppercase text-slate-400">GitHub Repository / Commit URL</label>
                                    <input type="text" id="ghInput" value="${store.githubUrl}" placeholder="https://github.com/username/repo-day1" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <div class="space-y-1">
                                    <label class="block text-xs font-bold uppercase text-slate-400">LinkedIn Post URL</label>
                                    <input type="text" id="liInput" value="${store.linkedinUrl}" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <button onclick="app.submitDay1()" class="sys-btn w-full py-3.5 rounded-xl text-xs sm:text-sm">
                                    ${isSubmitted ? 'Update Submission ✓' : 'Submit Proof & Sync Streak ⚡'}
                                </button>
                            </div>

                            ${isSubmitted ? `
                                <div class="sys-panel bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-2xl text-center text-xs sm:text-sm text-emerald-300 font-bold">
                                    🎉 Day 1 Verified Successfully! Your public learning streak is active.
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            }
        };

        const app = {
            handleAuth() {
                const email = document.getElementById('dashEmail').value.trim();
                const pass = document.getElementById('dashPass').value.trim();
                const nameInput = document.getElementById('dashName');
                const name = nameInput ? (nameInput.value.trim() || 'Scholar') : (email.split('@')[0] || 'Scholar');

                if (!email || !pass) {
                    alert('Please enter your email and password.');
                    return;
                }
                store.currentUser = { name, email };
                localStorage.setItem('cal_user', JSON.stringify(store.currentUser));
                router.navigate('/dashboard');
            },

            handleLogout() {
                store.currentUser = null;
                localStorage.removeItem('cal_user');
                router.navigate('/dashboard');
            },

            addNewTaskPrompt(dayName) {
                const category = prompt("Enter category (work, personal, appointments, reminders):", "work");
                if (!category || !store.calendarData[dayName][category.toLowerCase()]) {
                    alert("Invalid category. Choose from: work, personal, appointments, reminders");
                    return;
                }
                const taskText = prompt("Enter task or activity description:");
                if (!taskText) return;

                store.calendarData[dayName][category.toLowerCase()].push(taskText);
                localStorage.setItem('cal_daily_data', JSON.stringify(store.calendarData));
                router.render('/calendar');
            },

            removeTaskItem(dayName, category, idx) {
                store.calendarData[dayName][category].splice(idx, 1);
                localStorage.setItem('cal_daily_data', JSON.stringify(store.calendarData));
                router.render('/calendar');
            },

            submitDay1() {
                const gh = document.getElementById('ghInput').value.trim();
                const li = document.getElementById('liInput').value.trim();
                if (!gh || !li) {
                    alert('Please provide both GitHub and LinkedIn proof links.');
                    return;
                }
                store.githubUrl = gh;
                store.linkedinUrl = li;
                if (!store.completedDays.includes(1)) {
                    store.completedDays.push(1);
                    store.streak = 1;
                }
                localStorage.setItem('cal_gh_1', gh);
                localStorage.setItem('cal_li_1', li);
                localStorage.setItem('cal_completed', JSON.stringify(store.completedDays));
                localStorage.setItem('cal_streak', store.streak);
                router.render('/day/1');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
